name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Deploy on merge dev -> main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t backend:latest ./backend

      - name: Build frontend image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_BACKEND_URL=https://api.devgon.pl \
            --build-arg NEXT_PUBLIC_DOMAIN=devgon.pl \
            --build-arg NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ secrets.UMAMI_WEBSITE_ID }} \
            --build-arg NEXT_PUBLIC_UMAMI_SRC=https://analytics.devgon.pl/script.js \
            --build-arg NEXT_PUBLIC_CONTACT_EMAIL=devgonteam@gmail.com \
            --build-arg NEXT_PUBLIC_CONTACT_PHONE=${{ secrets.CONTACT_PHONE }} \
            -t frontend:latest ./frontend

      - name: Save images as tar.gz
        run: |
          docker save backend:latest | gzip > backend.tar.gz
          docker save frontend:latest | gzip > frontend.tar.gz

      - name: Upload backend image
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "backend.tar.gz"
          target: "/home/${{ secrets.VPS_USER }}/app"

      - name: Upload frontend image
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "frontend.tar.gz"
          target: "/home/${{ secrets.VPS_USER }}/app"

      - name: Upload docker-compose
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/home/${{ secrets.VPS_USER }}/app"

      - name: SSH and scripts on VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            
            cd /home/${{ secrets.VPS_USER }}/app
            
            echo "client_max_body_size 1000M;" > client_max_body_size.conf
            
            echo "Loading backend image..."
            gunzip -c backend.tar.gz | docker load
            
            echo "Loading frontend image..."
            gunzip -c frontend.tar.gz | docker load
            
            echo "Writing environment variables to .env..."
            {
              echo "NODE_ENV=production"
              echo "FRONTEND_URL=https://devgon.pl"
              echo "BACKEND_URL=https://api.devgon.pl"
              echo "JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}"
              echo "COOKIE_DOMAIN=.devgon.pl"
              echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}"
              echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}"
              echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}"
              echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}"
              echo "DATABASE_URL=postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/devgon"
              echo "MINIO_ENDPOINT=minio"
              echo "MINIO_PORT=9000"
              echo "MINIO_USE_SSL=false"
              echo "MINIO_ROOT_USER=${{ secrets.MINIO_ROOT_USER }}"
              echo "MINIO_ROOT_PASSWORD=${{ secrets.MINIO_ROOT_PASSWORD }}"
              echo "MINIO_BUCKET_NAME=media"
              echo "MINIO_PUBLIC_URL=https://minio.devgon.pl"
              echo "SMTP_HOST=smtp-relay.brevo.com"
              echo "SMTP_PORT=587"
              echo "SMTP_USER=${{ secrets.SMTP_USER }}"
              echo "SMTP_PASS=${{ secrets.SMTP_PASS }}"
              echo "SMTP_FROM=devgonteam@gmail.com"
              echo "CONTACT_MAIL_TO=devgonteam@gmail.com"
              echo "UMAMI_APP_SECRET=${{ secrets.UMAMI_APP_SECRET }}"
            } > .env
            
            echo "Starting postgres and minio first..."
            docker compose up -d postgres minio
            
            echo "Waiting for services to be healthy..."
            sleep 10
            
            echo "Running database migrations..."
            docker compose run --rm --no-deps backend npm run migration:prod
            
            echo "Starting all containers..."
            docker compose up -d --remove-orphans
            
            echo "Deleting old images..."
            docker image prune -f
            
            echo "Deployment finished successfully."