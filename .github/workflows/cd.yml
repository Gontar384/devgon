name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Deploy on merge dev -> main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build \
            -t backend:latest \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_BACKEND_URL=https://devgon.site/api \
            -t frontend:latest \
            ./frontend

      - name: Save images as tar.gz
        run: |
          docker save backend:latest | gzip > backend.tar.gz
          docker save frontend:latest | gzip > frontend.tar.gz

      - name: Upload images and configs to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: |
            backend.tar.gz
            frontend.tar.gz
            docker-compose.yml
            nginx/nginx.conf
          target: "/home/${{ secrets.VPS_USER }}/app"

      - name: SSH and deploy on VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e  # przerwij skrypt, jeśli jakikolwiek krok się nie powiedzie
            cd /home/${{ secrets.VPS_USER }}/app

            echo "Loading backend image..."
            gunzip -c backend.tar.gz | docker load

            echo "Loading frontend image..."
            gunzip -c frontend.tar.gz | docker load

            echo "Writing environment variables to .env..."
            echo "NODE_ENV=prod" > .env
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
            echo "FRONTEND_URL=https://devgon.site" >> .env

            echo "Running database migrations..."
            docker compose run --rm backend npm run migration:prod

            echo "Restarting containers..."
            docker compose up -d

            echo "Deployment finished successfully."