name: Tests

on:
  push:
    branches:
      - dev

jobs:
  test-before-pr:
    name: Test on dev push before PR
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.1

      - name: Start PostgreSQL
        run: |
          docker run -d \
            --name postgres \
            -p 5432:5432 \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=password \
            -e POSTGRES_DB=devgon_test \
            postgres:17.5

      - name: Start MinIO
        run: |
          docker run -d \
            --name minio \
            -p 9000:9000 \
            -p 9001:9001 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin123 \
            minio/minio:latest \
            server /data --console-address ":9001"

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Install Playwright Browser
        run: npx playwright install chromium
        working-directory: frontend

      - name: Wait for PostgreSQL to be ready
        run: |
          until docker exec postgres pg_isready -U postgres; do
            echo "Waiting for postgres..."
            sleep 2
          done

      - name: Wait for MinIO to be ready
        run: |
          until curl -f http://localhost:9000/minio/health/live; do
            echo "Waiting for MinIO..."
            sleep 2
          done

      - name: Set DATABASE_URL for tests
        run: echo "DATABASE_URL=postgresql://postgres:password@localhost:5432/devgon_test" >> $GITHUB_ENV

      - name: Create .env.test
        run: |
          {
            echo "NODE_ENV=testing"
            echo "FRONTEND_URL=http://localhost:3000"
            echo "BACKEND_URL=http://localhost:4000"
            echo "DATABASE_URL=${{ env.DATABASE_URL }}"
            echo "JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}"
            echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}"
            echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}"
            echo "COOKIE_DOMAIN=.test.site"
            echo "MINIO_ENDPOINT=localhost"
            echo "MINIO_PORT=9000"
            echo "MINIO_USE_SSL=false"
            echo "MINIO_ROOT_USER=minioadmin"
            echo "MINIO_ROOT_PASSWORD=minioadmin123"
            echo "MINIO_BUCKET_NAME=media-test"
          } > .env.test
        working-directory: backend

      - name: Create frontend .env
        run: |
          {
            echo "NEXT_PUBLIC_BACKEND_URL=http://localhost:4000"
            echo "NEXT_PUBLIC_DOMAIN=test.site"
          } > .env
        working-directory: frontend

      - name: Run database migrations
        run: npm run migration:dev
        working-directory: backend

      - name: Run Tests and Lint
        run: |
          npm run test:all --prefix backend
          npm run check:code