name: Tests

on:
  push:
    branches:
      - dev

jobs:
  test-before-pr:
    name: Test on dev push before PR
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.5
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: devgon_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      minio:
        image: minio/minio:latest
        ports:
          - 9000:9000
          - 9001:9001
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin123
        options: >-
          --health-cmd "mc ready local"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 3

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.1

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Install Playwright Browser
        run: npx playwright install chromium
        working-directory: frontend

      - name: Wait for PostgreSQL to be ready
        run: |
          until pg_isready -h localhost -p 5432; do
            echo "Waiting for postgres..."
            sleep 2
          done

      - name: Wait for MinIO to be ready
        run: |
          until curl -f http://localhost:9000/minio/health/live; do
            echo "Waiting for MinIO..."
            sleep 2
          done

      - name: Set DATABASE_URL for tests
        run: echo "DATABASE_URL=postgresql://postgres:password@localhost:5432/devgon_test" >> $GITHUB_ENV

      - name: Create .env.test
        run: |
          {
            echo "NODE_ENV=testing"
            echo "FRONTEND_URL=http://localhost:3000"
            echo "BACKEND_URL=http://localhost:4000"
            echo "DATABASE_URL=${{ env.DATABASE_URL }}"
            echo "JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}"
            echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}"
            echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}"
            echo "COOKIE_DOMAIN=.test.site"
            echo "MINIO_ENDPOINT=localhost"
            echo "MINIO_PORT=9000"
            echo "MINIO_USE_SSL=false"
            echo "MINIO_ROOT_USER=minioadmin"
            echo "MINIO_ROOT_PASSWORD=minioadmin123"
            echo "MINIO_BUCKET_NAME=media"
          } > .env.test
        working-directory: backend

      - name: Create frontend .env
        run: |
          {
            echo "NEXT_PUBLIC_BACKEND_URL=http://localhost:4000"
            echo "NEXT_PUBLIC_DOMAIN=test.site"
          } > .env
        working-directory: frontend

      - name: Run database migrations
        run: npm run migration:dev
        working-directory: backend

      - name: Run Tests and Lint
        run: |
          npm run test
          npm run check:code