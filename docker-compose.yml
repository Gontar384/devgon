services:
  postgres:
    image: postgres:17.5-alpine
    container_name: prod_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: devgon
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: prod_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # VIRTUAL_HOST: minio.devgon.site
      # VIRTUAL_PORT: 9001
      # LETSENCRYPT_HOST: minio.devgon.site
    volumes:
      - minio_prod_data:/data
    command: server /data --console-address ":9001"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    image: backend:latest
    container_name: backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VIRTUAL_HOST: api.devgon.site
      LETSENCRYPT_HOST: api.devgon.site
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    image: frontend:latest
    container_name: frontend
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: devgon.site
      LETSENCRYPT_HOST: devgon.site
    networks:
      - app-network
    depends_on:
      - backend

  nginx-proxy:
    image: nginxproxy/nginx-proxy:latest
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./data/vhost.d:/etc/nginx/vhost.d
      - ./data/html:/usr/share/nginx/html
      - ./data/certs:/etc/nginx/certs
      - /var/run/docker.sock:/tmp/docker.sock:ro
    networks:
      - app-network

  nginx-proxy-acme:
    image: nginxproxy/acme-companion:latest
    container_name: nginx-proxy-acme
    restart: unless-stopped
    environment:
      DEFAULT_EMAIL: devgonteam@gmail.com
      NGINX_PROXY_CONTAINER: nginx-proxy
    volumes:
      - ./data/vhost.d:/etc/nginx/vhost.d
      - ./data/html:/usr/share/nginx/html
      - ./data/certs:/etc/nginx/certs
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - nginx-proxy
    networks:
      - app-network

volumes:
  postgres_prod_data:
  minio_prod_data:

networks:
  app-network:
    driver: bridge