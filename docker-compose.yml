services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    expose:
      - "4000"
    ports:
      - "4000:4000"
    environment:
        NODE_ENV: 'dev'
        DATABASE_URL: 'postgresql://postgres:20024062@host.docker.internal:5432/devgon'
        FRONTEND_URL: 'http://localhost:3000'
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    expose:
      - "3000"
    ports:
      - "3000:3000"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

